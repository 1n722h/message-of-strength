name: Controller tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'controller/**'
      - 'tests/**'
      - '.github/workflows/manual-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
